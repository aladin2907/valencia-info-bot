services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-valencia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-valencia}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # схема и функции применяются автоматически при первом старте
      - ./sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-valencia} -d ${POSTGRES_DB:-valencia}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
